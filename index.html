<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Music | Interactive Demo</title>

<style>
* { box-sizing: border-box; }

body {
margin: 0;
min-height: 100vh;
background: #f7f7f5;
color: #252525;
font-family: Arial, sans-serif;
display: grid;
place-items: center;
padding: 24px;
}

.player {
width: 100%;
max-width: 620px;
background: white;
padding: 42px;
border: 1px solid #e8e8e5;
border-radius: 16px;
}

.eyebrow {
font-size: 11px;
letter-spacing: 2px;
color: #888;
text-transform: uppercase;
}

h1 {
font-size: 34px;
font-weight: 500;
margin: 20px 0 10px;
}

.description {
color: #777;
line-height: 1.6;
font-size: 14px;
}

.divider {
border: 0;
border-top: 1px solid #eee;
margin: 30px 0;
}

.state-label {
font-size: 12px;
color: #888;
margin-bottom: 14px;
}

.stages {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
}

.stage {
background: white;
border: 1px solid #ddd;
padding: 19px;
border-radius: 9px;
text-align: left;
cursor: pointer;
color: #333;
transition: 0.2s;
}

.stage.active {
border-color: #333;
background: #f3f3f0;
}

.stage small {
display: block;
color: #888;
margin-top: 8px;
}

.controls {
display: flex;
justify-content: space-between;
align-items: center;
margin-top: 28px;
gap: 12px;
}

.play {
border: none;
background: #292929;
color: white;
border-radius: 30px;
padding: 13px 25px;
cursor: pointer;
}

.status {
font-size: 12px;
color: #777;
}

.footer {
text-align: center;
color: #aaa;
font-size: 11px;
margin-top: 35px;
letter-spacing: 1px;
}

@media(max-width: 480px) {
.player { padding: 25px; }
h1 { font-size: 28px; }
}
</style>
</head>

<body>

<main class="player">
<div class="eyebrow">Interactive Audio Demonstration</div>

<h1>Adaptive Music</h1>

<p class="description">
Explore how a musical composition transforms
between different gameplay states.
Select a state to hear the music adapt.
</p>

<hr class="divider">

<div class="state-label">SELECT MUSICAL STATE</div>

<div class="stages">
<button class="stage active" data-stage="0">
01 — Normal
<small>Standard gameplay</small>
</button>

<button class="stage" data-stage="1">
02 — Attack
<small>Combat intensity</small>
</button>
</div>

<div class="controls">
<button class="play" id="play">▶ Play</button>
<span class="status" id="status">Ready to explore</span>
</div>

<div class="footer">
ADAPTIVE MUSIC COMPOSITION
</div>
</main>

<audio id="audioA" src="./normal.mp3" preload="auto"></audio>
<audio id="audioB" src="./attack.mp3" preload="auto"></audio>



<script>
const audios = [
document.getElementById("audioA"),
document.getElementById("audioB")
];

const buttons = document.querySelectorAll(".stage");
const playButton = document.getElementById("play");
const statusText = document.getElementById("status");

audios.forEach(audio => {
  audio.addEventListener("error", () => {
    statusText.textContent = "Couldn't load: " + audio.currentSrc;
  });
});

let context;
let gains = [];
let active = 0;
let playing = false;
let transitioning = false;

function setupAudio() {
if (context) return;

context = new AudioContext();

audios.forEach((audio, i) => {
const source = context.createMediaElementSource(audio);
const gain = context.createGain();

gain.gain.value = i === 0 ? 1 : 0;

source.connect(gain);
gain.connect(context.destination);

gains.push(gain);

audio.addEventListener("error", () => {
statusText.textContent =
"Audio couldn't load: " + audio.currentSrc;
});
});
}

function updateButtons() {
buttons.forEach((button, i) => {
button.classList.toggle("active", i === active);
button.disabled = transitioning;
});
}

async function playMusic() {
setupAudio();
await context.resume();

try {
await audios[active].play();
playing = true;
playButton.textContent = "Ⅱ Pause";
statusText.textContent = "Playing";
} catch (error) {
statusText.textContent = "Audio playback failed";
console.error(error);
}
}

function pauseMusic() {
audios.forEach(audio => audio.pause());
playing = false;
playButton.textContent = "▶ Play";
statusText.textContent = "Paused";
}

playButton.addEventListener("click", async () => {
if (playing) {
pauseMusic();
} else {
await playMusic();
}
});

async function changeStage(next) {
if (next === active || transitioning) return;

setupAudio();
await context.resume();

if (!playing) {
active = next;

gains.forEach((gain, i) => {
gain.gain.setValueAtTime(
i === active ? 1 : 0,
context.currentTime
);
});

updateButtons();
statusText.textContent = "Ready to explore";
return;
}

transitioning = true;
updateButtons();

const outgoing = audios[active];
const incoming = audios[next];

try {
const position = outgoing.currentTime;

incoming.currentTime = Math.min(
position,
incoming.duration || position
);

const now = context.currentTime;
const duration = 2.5;

const oldGain = gains[active].gain;
const newGain = gains[next].gain;

oldGain.cancelScheduledValues(now);
newGain.cancelScheduledValues(now);

oldGain.setValueAtTime(oldGain.value, now);
newGain.setValueAtTime(0, now);

await incoming.play();

oldGain.linearRampToValueAtTime(0, now + duration);
newGain.linearRampToValueAtTime(1, now + duration);

setTimeout(() => {
outgoing.pause();
outgoing.currentTime = 0;

active = next;
transitioning = false;

updateButtons();
statusText.textContent = "Playing";
}, duration * 1000 + 100);

} catch (error) {
transitioning = false;
updateButtons();
statusText.textContent = "Transition failed";
console.error(error);
}
}

buttons.forEach(button => {
button.addEventListener("click", () => {
changeStage(Number(button.dataset.stage));
});
});

audios.forEach(audio => {
audio.addEventListener("ended", () => {
if (audios[active] === audio && !transitioning) {
playing = false;
playButton.textContent = "▶ Play";
statusText.textContent = "Finished";
}
});
});
</script>

</body>
</html>
